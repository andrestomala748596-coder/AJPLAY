name: AJPLAY Build Client Catalog

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Supabase client UUID"
        required: true
        default: "19790397-8b78-401e-8c68-f226372e4a9a"
        type: string
  repository_dispatch:
    types: [ajplay-catalog-refresh]

permissions:
  contents: read

concurrency:
  group: ajplay-catalog-${{ github.event.inputs.client_id || github.event.client_payload.client_id }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.client_payload.client_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AJPLAY
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Extract assigned servers and publish catalogs
        env:
          CLIENT_ID: ${{ inputs.client_id || github.event.client_payload.client_id }}
          CATALOG_SOURCE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AJPLAY_CATALOG_SOURCE_TOKEN: ${{ secrets.AJPLAY_CATALOG_SOURCE_TOKEN }}
          WORKER_URL: ${{ vars.AJPLAY_WORKER_URL }}
          CATALOG_WRITE_TOKEN: ${{ secrets.CATALOG_WRITE_TOKEN }}
        run: python catalog_builder/build_catalog.py
