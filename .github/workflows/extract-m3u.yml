name: AJPLAY M3U Extractor

on:
  workflow_dispatch:
    inputs:
      m3u_url:
        description: "URL completa de la lista M3U/M3U+"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AJPLAY
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Extract M3U playlist
        env:
          M3U_URL: ${{ inputs.m3u_url }}
        run: python extractor_m3u.py --url "$M3U_URL" --output catalog.json

      - name: Upload extracted catalog
        uses: actions/upload-artifact@v4
        with:
          name: ajplay-m3u-catalog
          path: catalog.json
          if-no-files-found: error
          retention-days: 7
